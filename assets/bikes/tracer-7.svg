<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" fill="none" stroke-linecap="round" stroke-linejoin="round">
<title>Tracer 7</title>
<style>
.l path,.l circle{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 16s cubic-bezier(.6,0,.3,1) infinite}
.glow{stroke-width:7;opacity:.16}.core{stroke-width:1.7}
.bike{animation:bob .7s ease-in-out infinite alternate}
.spin{stroke:#fff;stroke-width:1.2;opacity:0;animation:spin 1.1s linear infinite,show 16s infinite}
.road{stroke:#ff3b30;stroke-width:2;stroke-dasharray:46 26;opacity:0;animation:road .55s linear infinite,show 16s infinite}
.sp{stroke:#fff;stroke-width:1.4;opacity:0;animation:sp 1.6s linear infinite}
.sp:nth-of-type(2){animation-delay:-.6s}.sp:nth-of-type(3){animation-delay:-1.1s}
@keyframes draw{0%{stroke-dashoffset:1;opacity:1}20%{stroke-dashoffset:0}90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes show{0%,14%{opacity:0}22%,88%{opacity:.8}100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{to{transform:translateY(1.5px)}}
@keyframes road{to{stroke-dashoffset:-72}}
@keyframes sp{0%{transform:translateX(60px);opacity:0}30%{opacity:.5}100%{transform:translateX(-80px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.l path,.l circle{stroke-dashoffset:0}.spin,.road{opacity:.8}}
</style>
